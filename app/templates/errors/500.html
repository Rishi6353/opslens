{% extends 'base.html' %}

{% block title %}500 Server Error{% endblock %}

{% block content %}
<div style="text-align: center; padding: 4rem 1rem;">
    <div style="font-size: 3.5rem; margin-bottom: 1rem;">⚠️ 500</div>
    <h1 style="font-size: 2rem; margin-bottom: 0.5rem;">Internal Server Error</h1>
    <p style="color: var(--text-secondary); max-width: 500px; margin: 0 auto 1.5rem auto;">
        An unexpected error occurred while processing your request. The incident details have been securely logged to internal system logs.
    </p>
    <div style="display: flex; gap: 1rem; justify-content: center;">
        <a href="{{ url_for('analytics.dashboard') if g.user else url_for('auth.login') }}" class="btn btn-primary">
            Return to Dashboard &rarr;
        </a>
    </div>
</div>
{% endblock %}
