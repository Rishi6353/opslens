{% extends 'base.html' %}

{% block title %}Edit Ticket #{{ ticket.id }}{% endblock %}

{% block content %}
<div style="margin-bottom: 1.5rem;">
    <a href="{{ url_for('tickets.detail', ticket_id=ticket.id) }}" style="color: var(--text-secondary); font-size: 0.9rem;">
        &larr; Back to Ticket #{{ ticket.id }}
    </a>
    <h1 style="font-size: 1.75rem; margin-top: 0.5rem; margin-bottom: 0.25rem;">Edit Ticket #{{ ticket.id }}</h1>
    <p style="color: var(--text-secondary); font-size: 0.95rem;">Update the incident details, classification, priority, or status.</p>
</div>

<div class="card" style="max-width: 800px;">
    <form action="{{ url_for('tickets.edit', ticket_id=ticket.id) }}" method="POST">
        <!-- CSRF Protection Token -->
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

        <div class="form-group">
            <label for="title" class="form-label">Incident Title <span style="color: var(--danger);">*</span></label>
            <input type="text" id="title" name="title" class="form-control" maxlength="150" value="{{ ticket.title }}" required autofocus>
            <div class="form-help">Max 150 characters.</div>
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 1rem;">
            <div class="form-group">
                <label for="category_id" class="form-label">Category <span style="color: var(--danger);">*</span></label>
                <select id="category_id" name="category_id" class="form-select" required>
                    {% for cat in categories %}
                    <option value="{{ cat.id }}" {% if ticket.category_id == cat.id %}selected{% endif %}>{{ cat.name }}</option>
                    {% endfor %}
                </select>
            </div>

            <div class="form-group">
                <label for="priority" class="form-label">Priority <span style="color: var(--danger);">*</span></label>
                <select id="priority" name="priority" class="form-select" required>
                    {% for pr in valid_priorities %}
                    <option value="{{ pr }}" {% if ticket.priority == pr %}selected{% endif %}>{{ pr | capitalize }}</option>
                    {% endfor %}
                </select>
            </div>

            <div class="form-group">
                <label for="status" class="form-label">Status <span style="color: var(--danger);">*</span></label>
                <select id="status" name="status" class="form-select" required>
                    {% for st in valid_statuses %}
                    <option value="{{ st }}" {% if ticket.status == st %}selected{% endif %}>{{ st | replace('_', ' ') | capitalize }}</option>
                    {% endfor %}
                </select>
            </div>
        </div>

        <div class="form-group">
            <label for="description" class="form-label">Description &amp; Steps <span style="color: var(--danger);">*</span></label>
            <textarea id="description" name="description" class="form-control" rows="6" required>{{ ticket.description }}</textarea>
        </div>

        <div style="display: flex; gap: 1rem; align-items: center; margin-top: 1.5rem;">
            <button type="submit" class="btn btn-primary" style="padding: 0.65rem 1.5rem;">
                Save Changes &rarr;
            </button>
            <a href="{{ url_for('tickets.detail', ticket_id=ticket.id) }}" class="btn btn-ghost">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
